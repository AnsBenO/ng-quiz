<header class="border-b border-border bg-surface">
  <nav
    class="mx-auto flex min-h-14 max-w-5xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8"
    aria-label="Main"
  >
    <a routerLink="/" class="inline-flex items-center gap-2 text-lg font-semibold text-primary">
      <span class="grid size-8 place-items-center rounded-lg bg-primary text-sm text-on-primary"
        >Q</span
      >
      Quiz<span class="text-accent">Forge</span>
    </a>
    <button
      mat-icon-button
      type="button"
      [attr.aria-label]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="darkMode()"
      (click)="toggleTheme()"
    >
      <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </nav>
</header>
<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
  <router-outlet />
</main>
